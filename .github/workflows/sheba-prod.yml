name: Docker Image CI

on:
  push:
    branches: [ sheba-prod ]
  pull_request:
    branches: [ sheba-prod ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Check Out Repo 
        uses: actions/checkout@v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and Run Docker Compose (Test Locally)
        run: |
          docker-compose up -d --build
          sleep 20  # Increased time for service to start

      - name: Debug Running Containers
        run: docker ps -a

      - name: Print Service Logs
        run: docker logs app_version_control_service

      # - name: Health Check (Ensure Service is Running)
      #   run: |
      #     curl -f http://localhost:5041 || exit 1

      - name: Stop and Clean Up
        run: docker-compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # 🔴 FIX: Only ONE Buildx Setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/sheba-remit-consumer-prod:${{github.run_number}} 

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
